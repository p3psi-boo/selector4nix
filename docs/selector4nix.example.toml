# An example configuration of selector4nix.
# For a complete reference of all available fields, see docs/configuration.md.

# Server listen address.
[server]
# Listen IP address.
ip = "127.0.0.1"
# Listen port (default: 5496).
port = 5496

# Network request settings.
[network]
# Timeout in seconds for NAR info lookup requests (default: 30, minimum: 1).
nar_info_timeout_secs = 30
# Timeout in seconds for NAR file downloads, also used as connect timeout (default: 30, minimum: 1).
nar_timeout_secs = 30
# Maximum number of concurrent NAR file streaming requests per distinct substituter host (default: 12).
max_concurrent_requests = 12
# Latency tolerance window in milliseconds. After the fastest substituter responds,
# others have this many additional milliseconds before being pruned (default: 50).
tolerance_msecs = 50
# Treat NAR info lookup errors as not-found (default: false).
# WARNING: setting this to true may cause incorrect judgments about whether a NAR info actually exists.
ignore_nar_info_error = false
# Whether to continuously probe substituters for health every 30 seconds (default: true).
# Probing during retry recovery is always enabled regardless of this setting.
periodic_probing = true
# Whether to enable chunked NAR transfer via concurrent Range requests (default: true).
chunked_streaming = true
# Maximum chunk size in bytes for chunked NAR transfer (default: 4194304).
streaming_chunk_max_len = 4194304
# Maximum number of in-flight chunks per NAR file, also bounded by max_concurrent_requests (default: 8).
streaming_window_max_len = 8

# Fastly SNI proxy optimization for every automatically detected Fastly
# substituter (global section). Detection uses DoH A/CNAME answers, Fastly's
# published edge ranges, then Fastly response headers as a fallback. The URL,
# HTTP Host, and TLS SNI always remain the substituter's own values with strict
# certificate verification — only the TCP connection target IP is overridden
# (like `curl --resolve`). Candidates come from Fastly-specific SNI proxy
# lists and extra IP literals. Each candidate must pass an admission probe
# (TLS + GET /nix-cache-info returning 200) before use. If no proxy is
# usable, requests fall back to the default system-DNS path.
[fastly_optimization]
# Whether to enable Fastly SNI proxy optimization (default: false).
enabled = false
# Extra SNI proxy IPs as literals; domain names are not accepted (default: []).
candidates = []
# Fastly-specific SNI proxy IP sources. Each source is a plain-text list with
# one IPv4 or IPv6 address per line. file://, http://, and https:// are
# supported. Keep these separate from Cloudflare SNI proxy sources.
# sni_proxy_sources = [
#   { url = "file:///PATH/fastly-sni-proxies.txt", refresh_secs = 3600 },
#   { url = "https://HOST/fastly-sni-proxies.txt", refresh_secs = 3600 },
# ]

# Active bounded download through up to three latency-leading Fastly SNI proxies.
# The measured TTFB and MiB/s determine proxy order.
[fastly_optimization.bandwidth_probe]
enabled = true
# HTTPS sample URL. The default is an immutable cache.nixos.org NAR larger than 1 MiB.
url = "https://cache.nixos.org/nar/1as5cn000kck2y35awm3825qvlvcnq08jbilwdlzdlv6pbidk3i4.nar.zst"
# Number of bytes downloaded per benchmark (default: 1048576 = 1 MiB).
bytes = 1048576
# Re-benchmark an endpoint after this interval (default: 86400 = 24 hours).
refresh_secs = 86400
# Maximum simultaneous benchmark downloads (default: 1).
max_concurrent_probes = 1

# Cloudflare SNI proxy optimization for every automatically detected Cloudflare
# substituter (global section), including but not limited to Cachix. Detection
# uses DoH A/CNAME answers, Cloudflare's published edge ranges, then Cloudflare
# response headers as a fallback. The URL, HTTP Host, and TLS SNI always remain
# the substituter's own host with strict certificate verification — only the
# TCP connection target IP is overridden (like `curl --resolve`). Candidates
# come from Cloudflare-specific SNI proxy lists and extra IP literals. Each
# candidate must pass an admission probe (TLS + GET /nix-cache-info returning
# 200) before use. If no proxy is usable, requests fall back to the default
# system-DNS path.
[cloudflare_optimization]
# Whether to enable Cloudflare SNI proxy optimization (default: false).
enabled = false
# Extra SNI proxy IPs as literals; domain names are not accepted (default: []).
candidates = []
# Cloudflare-specific SNI proxy lists. One IPv4 or IPv6 address per line;
# blank lines, full-line comments, and inline # comments are ignored. Domains,
# CIDRs, and IP:port entries are rejected. Sources may use file://, http://, or
# https://. The last successful list stays in memory after a refresh failure.
# sni_proxy_sources = [
#   { url = "file:///PATH/cloudflare-sni-proxies.txt", refresh_secs = 3600 },
#   { url = "https://HOST/cloudflare-sni-proxies.txt", refresh_secs = 3600 },
# ]

# Active bounded download through up to three latency-leading Cloudflare SNI proxies.
# The default URL returns exactly `bytes` bytes from Cloudflare's speed
# endpoint. Override it with another HTTPS URL that serves at least `bytes`.
[cloudflare_optimization.bandwidth_probe]
enabled = true
url = "https://speed.cloudflare.com/__down?bytes=1048576"
bytes = 1048576
refresh_secs = 86400
max_concurrent_probes = 1

# Proxy behavior settings.
[proxy]
# Whether to rewrite NAR URLs in NAR info responses (default: true).
# When false, the original URL from the upstream substituter is preserved as-is.
rewrite_nar_url = true
# Controls how the URL field is rewritten when rewrite_nar_url is enabled (default: "self").
# - "self": rewrite to a relative path so NAR requests go through selector4nix.
# - "upstream": rewrite to the winning upstream substituter's storage URL.
rewrite_to_target = "self"
# How substituters are queried for NAR info (default: "preference").
# - "preference": query all substituters at once, pick the winner by
#   preference (-tolerance * priority - latency).
# - "tier": query priority tiers one after another; lower-priority
#   tiers are only queried when every higher-priority tier lacks the NAR info.
resolution_policy = "preference"

# Cache info exposed via /nix-cache-info endpoint.
[cache_info]
# Nix store directory path (default: "/nix/store", must be absolute).
store_dir = "/nix/store"
# Whether to advertise support for mass queries (default: true).
want_mass_query = true
# Cache priority advertised to Nix clients (default: 40).
priority = 40

# Internal LRU cache settings for NAR info content and NAR file location data.
[cache]
# Maximum number of cached NAR info entries (default: 4096).
nar_info_cache_capacity = 4096
# Time-to-live in seconds for cached NAR info entries (default: 14400, minimum: 1).
nar_info_ttl_secs = 14400
# Maximum number of cached NAR file location entries (default: 4096).
nar_file_cache_capacity = 4096
# Time-to-live in seconds for cached NAR file location entries (default: 14400, minimum: 1).
nar_file_ttl_secs = 14400

# Upstream substituter list (at least one required).
[[substituters]]
# Base URL of the upstream substituter.
url = "https://cache.nixos.org/"
# Priority of this substituter; higher values mean lower priority (default: 40).
priority = 40

[[substituters]]
url = "https://mirrors.tuna.tsinghua.edu.cn/nix-channels/store/"
# Higher priority value than the official cache, so it is tried after cache.nixos.org.
priority = 45
# Per-substituter timeout overrides, fall back to network.nar_info_timeout_secs when unset (default: none).
nar_info_timeout_secs = 30
# Per-substituter timeout overrides, fall back to network.nar_timeout_secs when unset (default: none).
nar_timeout_secs = 30

[[substituters]]
url = "https://mirrors.ustc.edu.cn/nix-channels/store/"
priority = 45

[[substituters]]
url = "https://mirror.sjtu.edu.cn/nix-channels/store/"
priority = 45

[[substituters]]
url = "https://nix-community.cachix.org/"
priority = 40

[[substituters]]
url = "https://selector4nix.cachix.org/"
priority = 40

[[substituters]]
url = "https://cache.garnix.io/"
# Override the base URL used for NAR file downloads (default: <url>/nar/).
# Garnix does not serve NAR files at https://cache.garnix.io/nar/.
storage_url = "https://garnix-cache.com/"
priority = 40

[[substituters]]
url = "https://attic.example.com/"
# Per-substituter override for concurrent NAR streaming requests to this
# substituter's host, useful for servers sensitive to concurrency (default:
# none, i.e. fall back to network.max_concurrent_requests).
max_concurrent_requests = 4
